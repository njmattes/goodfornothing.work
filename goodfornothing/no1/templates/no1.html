{% extends 'base.html' %}
{% block title_extra %}(No. 1){% endblock %}
{% block head_css %}
  <link rel=stylesheet
        href={{ url_for('main.static', filename='css/gfn.css') }}>
{% endblock %}
{% block body_js %}
<script src={{ url_for('main.static', filename='js/vendor/d3.v5.min.js') }}></script>
<script src={{ url_for('main.static', filename='js/vendor/d3-timer.v1.min.js') }}></script>
<script>

  /**
   * Size of pixels. Defaults to 20.
   * @type {number}
   */
  const size = {{ size }};

  /**
   * Amount of pixels to draw at one time. Defaults to 10.
   * @type {number}
   */
  const number = {{ number }};

  /**
   * Interval in milliseconds between drawing pixels.
   * Defaults to 20.
   * @type {number}
   */
  const timer = {{ timer }};

  /**
   * Algorithm changes from random to averaged pixels once the
   * reciprocal of the threshold of area of screen is covered.
   * @type {number}
   */
  const threshold = {{ threshold }};

  /**
   * Determines the number of nearest pixels to average from when
   * determining colors.
   * @type {number}
   */
  const network = {{ network }};

  /**
   * Whether to draw in color ('c') or greyscale ('g')
   * @type {string}
   */
  const cg = '{{ cg }}';

</script>

<script src={{ url_for('no1.static', filename='js/no1.v1.js') }}></script>
{% endblock %}
